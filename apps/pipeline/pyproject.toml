[project]
name = "kidscafe-pipeline"
version = "0.1.0"
description = "kidscafe 데이터 파이프라인: 공공데이터 수집·정규화·매칭·상태 판정"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.36,<3.0.0",
    "geoalchemy2>=0.16.0,<1.0.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "alembic>=1.14.0,<2.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "typer>=0.15.0,<1.0.0",
    "httpx>=0.28.0,<1.0.0",
    "pyproj>=3.8.0",
    "rapidfuzz>=3.14.6",
]

[project.scripts]
kidscafe-pipeline = "kidscafe_pipeline.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "ruff>=0.9.0,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kidscafe_pipeline"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# alembic이 생성한 DDL은 손대지 않고 그대로 둔다.
"migrations/versions/*.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# typer의 옵션 선언은 기본값 자리에 호출을 쓰는 것이 정상 관용구다.
extend-immutable-calls = ["typer.Option", "typer.Argument"]
