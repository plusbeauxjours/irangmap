name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pipeline dependencies
        run: uv sync --directory apps/pipeline --frozen

      - name: Lint pipeline
        run: pnpm lint:pipeline

      - name: Test pipeline
        run: pnpm test:pipeline

      - name: Lint web
        run: pnpm lint:web

      - name: Test web
        run: pnpm test:web

      - name: Build web
        run: pnpm build:web

      - name: Validate Compose configuration
        run: docker compose config
