name: Refresh data

# 공공데이터·서울형 키즈카페를 정기 수집해 지도 GeoJSON을 갱신하고 커밋한다.
# 커밋이 생기면 Vercel이 자동 재배포한다. 프랜차이즈 추출(claude -p)은 로그인 세션이 필요해 로컬에서 수동.
on:
  schedule:
    - cron: "0 19 * * *" # 매일 04:00 KST — 놀이시설·테마파크·서울형
    - cron: "0 17 * * 0" # 매주 일 02:00 KST — 휴게음식점 전량(6,474콜)
    - cron: "0 18 1 * *" # 매월 1일 03:00 KST — 프랜차이즈 공식 사이트 재수집·Azure 재추출
  workflow_dispatch:
    inputs:
      full:
        description: "휴게음식점 전량까지 다시 받기"
        type: boolean
        default: false
      franchise:
        description: "프랜차이즈 공식 사이트 재수집 + Azure 재추출"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    env:
      DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      VWORLD_KEY: ${{ secrets.VWORLD_KEY }}
      DATAGOKR_THEMEPARK_URL: https://apis.data.go.kr/1741000/amusement_facilities_other/info
      DATAGOKR_RESTCAFE_URL: https://apis.data.go.kr/1741000/rest_cafes/info
      DATAGOKR_PLAYGROUND_URL: https://apis.data.go.kr/1741000/pfc3/getPfctInfo3
      ENABLE_UMPPA: "true"
      DATABASE_URL: postgresql://unused:unused@localhost:5433/unused
      LLM_BACKEND: azure
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_RESOURCE: ${{ secrets.AZURE_OPENAI_RESOURCE }}
      AZURE_OPENAI_DEPLOYMENT: modulabs-gpt-5.5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: uv sync --directory apps/pipeline --frozen

      # GitHub 러너(미국)에서 한국 공공 API가 닿는지 먼저 확인 — 첫 실행이 ConnectTimeout으로 실패했다
      - name: 연결 확인 (data.go.kr · 서울시 · VWorld)
        continue-on-error: true
        run: |
          for h in "https://apis.data.go.kr/1741000/pfc3/getPfctInfo3?serviceKey=x" "https://umppa.seoul.go.kr/icare/user/kidsCafe/BD_selectKidsCafeList.do" "https://api.vworld.kr/req/address"; do
            curl -s -m 20 -o /dev/null -w "%{http_code} connect=%{time_connect}s total=%{time_total}s $h\n" "$h" || echo "FAIL $h"
          done

      # 원본은 커밋하지 않는다(수십 MB). 매 실행마다 다시 받고 GeoJSON만 남긴다.
      - name: 놀이시설·테마파크·서울형 수집
        run: |
          pnpm pipeline ingest playground --dry-run --save data/raw/playground.jsonl.gz
          pnpm pipeline ingest themepark-other --dry-run --save data/raw/themepark_other.json
          pnpm pipeline ingest umppa --dry-run --save data/raw/umppa.json

      - name: 휴게음식점 캐시 복원 (평일)
        if: github.event.schedule != '0 17 * * 0' && !inputs.full
        uses: actions/cache/restore@v4
        with:
          path: data/raw/rest_cafes.part1.jsonl.gz
          key: rest-cafes-latest
          restore-keys: rest-cafes-

      # 주 1회·수동·또는 캐시가 없을 때(첫 실행) 전량. 캐시 없이 export하면 카페형 224곳이 빠진다(2026-09-21 2차 실행에서 확인).
      - name: 휴게음식점 전량
        if: github.event.schedule == '0 17 * * 0' || inputs.full || hashFiles('data/raw/rest_cafes.part1.jsonl.gz') == ''
        run: pnpm pipeline ingest rest-cafes --dry-run --save data/raw/rest_cafes.part1.jsonl.gz

      - name: 휴게음식점 캐시 저장
        if: always() && hashFiles('data/raw/rest_cafes.part1.jsonl.gz') != ''
        uses: actions/cache/save@v4
        with:
          path: data/raw/rest_cafes.part1.jsonl.gz
          key: rest-cafes-${{ github.run_id }}

      - name: 프랜차이즈 공식 사이트 재수집 + Azure 재추출 (월 1회 또는 수동)
        if: github.event.schedule == '0 18 1 * *' || inputs.franchise
        run: |
          pnpm pipeline ingest official --dry-run --brands "뽀로로파크,바운스,타요키즈,쁘띠몽드,점핑몬스터,챔피언,큐리키즈,헬로방방,꼬마대통령"
          pnpm pipeline extract official --backend azure --redo --out data/derived/official_attrs_azure.json

      - name: GeoJSON 생성 (프랜차이즈 추출물은 저장소의 official_attrs*.json 사용)
        run: |
          pnpm pipeline export geojson --out data/derived/venues.geojson
          # 안전장치: 업소 수가 커밋된 것보다 5% 넘게 줄면 부분 데이터로 보고 중단
          python3 - <<'PY'
          import json, sys
          new = len(json.load(open("data/derived/venues.geojson"))["features"])
          cur = len(json.load(open("apps/web/public/data/venues.geojson"))["features"])
          print(f"features: committed={cur} new={new}")
          if new < cur * 0.95:
              sys.exit(f"ABORT: {new} < 95% of {cur} — 원본 일부가 빠진 것으로 보임")
          PY
          pnpm data:sync

      - name: 변경 있으면 커밋
        run: |
          git config user.name "kidscafe-bot"
          git config user.email "kidscafe-bot@users.noreply.github.com"
          git add apps/web/public/data/venues.geojson data/derived/official_attrs_azure.json data/derived/umppa_geocode_cache.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "data: 정기 갱신 $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
